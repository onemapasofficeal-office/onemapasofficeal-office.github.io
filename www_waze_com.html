on and road closures around a major event","image_url":"https:\u002F\u002Fweb-assets.waze.com\u002Fsocial\u002Fog-event-landing.png","title":"Waze traffic alert:"}},"unready_events":"Unready Events","dynamic_info_disclaimer":"Information on this page is dynamic, actual road conditions may differ","end_of_list":"You've reached the end of the list","loading_events":"Loading events...","map":{"editor_link":"Edit this event"},"learn_more_title":"Learn more","overview":"Overview","recenter":"Recenter"},"guides":{"header":{"title":"Your essential guide to driving in Italy","description":"We've partnered with Waze Italian local drivers to help you avoid fines and drive smoothly.","cta":{"get_waze":"Get Waze","share":"Share","read_later":"Read later","view_routes":"View routes"}},"badges":{"automatic_fine":"Automatic fine"},"sections":{"ztl_zone":{"title":"ZTL zones","description_part_one":"Most Italian cities protect their historic centers with Limited Traffic Zones (ZTL). This is the most common cause of traffic fines for visitors. Unlike other countries, in Italy, ZTLs are strictly monitored by cameras, not police. A single wrong turn may trigger a fine that’s mailed to your home address months after your trip.","description_part_two":"Always check the signs for restricted hours. If your hotel is in a ZTL, call them in advance and ask them to register your license plate.","info_bubble":{"title":"ZTL in Waze","content":"When possible, Waze provides routes that bypass active ZTL zones, as long as your destination is outside the zone. If your destination is inside an active ZTL zone, Waze will alert you and ask you to add a pass or change your destination."}},"speed_cameras":{"title":"Speed cameras","description":"In Italy, speed cameras are often in gray or orange boxes, or mounted on a pole on highways and other paved roads. The system is fully automated and very strict. Even minor speeding infractions (5-10 km\u002Fh over) can be captured and may result in a fine sent by mail or to your rental agency.","info_bubble":{"title":"Speed cameras in Waze","content":"Waze gives you real-time alerts for fixed speed cameras and enforcement zones, relying on community-sourced data."}},"public_transport_lanes":{"title":"Public transport lanes","description":"Do not enter lanes marked with yellow lines or the words [bus], [taxi], or [tram]. These lanes are strictly reserved and frequently monitored by cameras. Using them, even for a moment, can trigger a fine."},"parking_regulations":{"title":"Parking regulations","white_lines":{"title":"White lines","description":"[White lines:] You can park for free, but check for signs indicating a time limit."},"blue_lines":{"title":"Blue lines","description":"[Blue lines:] You must pay to park. Use the meters to get a ticket and make sure to add your license plate number."},"yellow_lines":{"title":"Yellow lines","description":"[Yellow lines:] This is restricted parking for authorized vehicles only."},"pink_lines":{"title":"Pink lines","description":"[Pink lines:] Reserved for expectant mothers and parents with infants."}},"gas":{"title":"Gas","description":"Pumping gas in Italy is simple. However, the names can be confusing. [Gasolio] is diesel and [Benzina] is gasoline. Since it's easy to mix them up, always double-check the fuel cap before you start pumping and look for (E) for gas or (B) for diesel."},"toll_roads":{"title":"Toll roads","description_part_one":"Toll roads (Autostrade) are the fastest way to get between cities, but they can be expensive.","description_part_two":"When exiting, aim for the Blue Lanes marked \"Carte.\" Pay by tapping or inserting your credit card or Apple\u002FGoogle Pay.","description_part_three":"[Rental Tip:] Skip the \"Telepass\" device offered by rental agencies. The daily activation fees rarely justify the few minutes you might save compared to using the Blue Lanes."},"rural_areas":{"title":"Mountainous & rural areas","description_part_one":"If you’re planning a trip to Tuscany, the Amalfi Coast, the Alps, or the Dolomites, get ready for steep, winding roads with very sharp turns. The roads are often narrower than you might think, sometimes with one-and-a-half lanes and no shoulder.","description_part_two":"It’s common practice for locals to honk twice (two short taps) before a blind turn to warn drivers coming from the other direction.","description_part_three":"Don't feel pressured to keep up with local drivers who take the curves at high speeds. You can pull over at a designated roadside pull off to let them pass."},"specific_rules":{"title":"Specific rules to Italy","description_part_one":"[Headlights:] Turn them on at all times when you drive outside of cities, even during the day.","description_part_two":"[Roundabouts:] Usually, cars already in the roundabout have the right of way.","description_part_three":"[Scooters:] You’ll see scooters everywhere, so always check your mirrors. They often weave between lanes, especially in roundabouts and at traffic lights."},"emergency_numbers":{"title":"Emergency numbers","general":"General emergencies","medical":"Medical emergencies","roadside":"Roadside emergencies"},"vocabulary":{"title":"Essential vocabulary","gasoline":"Gasoline","diesel":"Diesel","highway":"Highway","toll":"Toll","card":"Card","exit":"Exit","yield":"Yield","one_way":"One way","parking":"Parking","no_parking":"No parking","pay":"Pay","free":"Free"},"cta":{"ready":"Ready for your Italian adventure?","start_driving":"Start driving","disclaimer":"The content above, provided by the Waze community, is for information purposes only and constitutes a mere recommendation from local drivers. This content is not a substitute for official legal advice or local traffic laws. Drivers are responsible for complying with all applicable local laws, regulations, and road signage.","link_copied":"link copied","link_copy_failure":"link could not be copied"},"footer":{"slogan":"Where drivers help drivers","terms_of_use":"Terms of Use",
